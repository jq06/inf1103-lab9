name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - TestStrategy.test_default_is_no_discount
          - TestStrategy.test_bulk_discount
          - TestStrategy.test_set_discount_changes_strategy
          - TestStrategy.test_student_discount_needs_no_order_change
          - TestStrategy.test_bulk_below_threshold
          - TestStrategy.test_no_discount
          - TestFactory.test_creates_correct_types
          - TestFactory.test_unknown_type
          - TestValidation.test_invalid_price
          - TestValidation.test_negative_stock
          - TestValidation.test_update_stock_negative
          - TestValidation.test_order_quantity_must_be_positive
          - TestInputHandling.test_get_positive_float_retries
          - TestLoadProducts.test_skips_bad_rows
          - TestLoadProducts.test_missing_file
    name: ${{ matrix.test }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run ${{ matrix.test }}
        run: python -m unittest tests.${{ matrix.test }} -v